<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Learn hiragana, katakana and JLPT N5 Japanese. Escape the office, fly to Osaka, buy an akiya.">
<meta name="theme-color" content="#1d232c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="One Way">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta property="og:title" content="One Way to Japan">
<meta property="og:description" content="Learn Japanese. Escape the grind. Buy an akiya.">
<meta property="og:image" content="og.jpg">
<style>html{-webkit-text-size-adjust:100%}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>One Way to Japan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Maru+Gothic:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one portrait phone frame. Stage 1 Singapore = slate glass over the rain painting. Stage 2 Osaka = washi paper under the autumn painting. Kana and word cards are always paper: each one is a scrap of Japan. */
:root{
  --paper:#f5ede0; --paper-2:#eadfcb; --ink:#2a2730; --ink-soft:#615a63;
  --torii:#cc4527; --momiji:#e5863a; --fuji:#5a6fa6; --moss:#4c7a52; --gold:#d3a23c;
  --slate:#1d232c; --slate-2:#27303b; --slate-3:#36414f; --mist:#d3d9e1; --mist-soft:#929dab; --night:#101318;
  --bg:var(--slate); --panel:var(--slate-2); --line:var(--slate-3); --text:var(--mist); --soft:var(--mist-soft); --hi:#ffffff;
  --card:var(--paper); --chip:rgba(255,255,255,.07); --tabbg:#171c23; --tabline:#2a323d; --mbg:var(--paper); --mfg:var(--ink); --goldtxt:var(--gold);
  --f-display:'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho',serif;
  --f-kana:'Klee One','Hiragino Maru Gothic ProN','Yu Gothic',sans-serif;
  --f-ui:'Zen Maru Gothic','Hiragino Maru Gothic ProN',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --r:14px;
  color-scheme:dark;
}
.jp{--bg:#f2e9d9; --panel:#fffaf1; --line:#e2d4bd; --text:#2a2730; --soft:#7d7168; --hi:#1f1c22; --card:#fffdf8; --chip:rgba(42,39,48,.06); --tabbg:#fffaf1; --tabline:#e2d4bd; --mbg:var(--ink); --mfg:var(--paper); --goldtxt:#9a6f12; color-scheme:light}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--mist);font-family:var(--f-ui);display:grid;place-items:center;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:2px solid var(--momiji);outline-offset:2px}
#app{position:relative;width:100%;max-width:440px;height:100%;overflow:hidden;overflow:clip;background:var(--slate)}
@media (min-width:520px) and (min-height:720px){#app{height:min(932px,calc(100% - 40px));border-radius:30px;box-shadow:0 40px 90px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.06)}}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;overflow:clip;background:var(--bg);color:var(--text);animation:fadeIn .35s ease both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.pad{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.bg{position:absolute;inset:0;background-size:cover;background-position:center}
.grow{flex:1}
.label{font-size:11.5px;font-family:var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin:0 0 8px;display:block}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border:0;border-radius:var(--r);font-weight:700;font-size:16px;letter-spacing:.01em;transition:transform .12s,opacity .2s;text-align:center}
.btn:active{transform:scale(.98)}
.btn svg{width:18px;height:18px}
.btn-red{background:var(--torii);color:var(--paper);box-shadow:0 6px 18px rgba(204,69,39,.3)}
.btn-paper{background:rgba(245,237,224,.94);color:var(--ink)}
.jp .btn-paper{background:var(--ink);color:var(--paper)}
.btn-ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn[disabled]{opacity:.38;pointer-events:none;box-shadow:none}
.btn-sm{min-height:40px;font-size:14px;width:auto;padding:0 16px;border-radius:11px}
.icon-btn{width:40px;height:40px;border-radius:12px;border:0;background:var(--chip);display:grid;place-items:center;color:var(--text);flex:none}
.icon-btn svg{width:20px;height:20px}

/* ---------- title ---------- */
.title-screen{background:#e9dcc4}
.title-sky{position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(28,22,20,.55) 82%,rgba(28,22,20,.85) 100%)}
.title-head{position:relative;padding-top:clamp(36px,9vh,80px);display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.title-kicker{font-family:var(--f-kana);font-weight:600;color:var(--torii);letter-spacing:.32em;font-size:13px;margin:0 0 10px}
.title-h1{font-family:var(--f-display);font-weight:800;color:var(--ink);font-size:clamp(40px,12.5vw,54px);line-height:.98;margin:0;letter-spacing:-.01em;text-shadow:0 1px 0 rgba(245,237,224,.6)}
.title-h1 em{font-style:normal;font-weight:500;font-size:.5em;display:block;letter-spacing:.06em;margin:6px 0 2px;color:var(--ink-soft)}
.hanko{flex:none;writing-mode:vertical-rl;background:var(--torii);color:var(--paper);font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.12em;padding:12px 7px;border-radius:5px;transform:rotate(4deg);box-shadow:inset 0 0 0 2px rgba(245,237,224,.5),inset 0 0 0 4px var(--torii),0 4px 14px rgba(120,30,10,.3);margin-top:6px}
.title-foot{position:relative;margin-top:auto;padding-bottom:max(26px,env(safe-area-inset-bottom,0px));display:grid;gap:10px}
.title-note{font-size:12.5px;color:rgba(245,237,224,.85);text-align:center;margin:4px 0 0}
.leaf-canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.corner-btn{position:absolute;top:max(14px,env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));z-index:3}
.title-screen .corner-btn{background:rgba(42,39,48,.18);color:var(--ink)}

/* ---------- story / day ---------- */
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(16,19,24,.15),rgba(16,19,24,.55) 40%,rgba(16,19,24,.94) 78%)}
.shade.warm{background:linear-gradient(180deg,rgba(245,237,224,0) 35%,rgba(40,28,22,.7) 70%,rgba(32,22,18,.94))}
.story{position:relative;margin-top:auto;padding-bottom:max(24px,env(safe-area-inset-bottom,0px));display:grid;gap:14px}
.story p{margin:0;font-size:16.5px;line-height:1.6;color:var(--mist);text-wrap:pretty;animation:rise .7s ease both}
.story p b{color:#fff;font-weight:700}
.story .time{font-family:var(--f-mono);font-size:12.5px;color:var(--mist-soft);letter-spacing:.06em}
.story .jpw{font-family:var(--f-kana);color:var(--momiji)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- setup / placement ---------- */
.setup-top{position:relative;height:118px;flex:none}
.setup-top .bg{background-position:center 30%;filter:saturate(.8)}
.setup-top::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(29,35,44,.2),var(--bg))}
.setup-top h2{position:absolute;bottom:10px;left:0;right:0;margin:0;font-family:var(--f-display);font-size:26px;color:var(--hi);z-index:1}
.form{display:grid;gap:18px;padding-top:22px;padding-bottom:16px}
.input{width:100%;height:52px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--hi);font:500 17px var(--f-ui);padding:0 16px}
.input::placeholder{color:#6d7887}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{position:relative;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:12px;text-align:left;display:flex;align-items:center;gap:12px;transition:border-color .2s,background .2s}
.opt[aria-pressed="true"]{border-color:var(--momiji);background:#33302e}
.opt svg.av{width:44px;height:44px;flex:none}
.job{display:grid;gap:4px;align-items:start}
.job b{font-size:16px;color:var(--hi)}
.job .firm{font-family:var(--f-mono);font-size:11.5px;color:var(--soft)}
.job .tag{font-size:13.5px;color:var(--text);line-height:1.5;margin-top:4px}
.job .perk{font-size:12.5px;color:var(--gold);margin-top:4px}
.stack{display:grid;gap:10px}
.sticky-foot{padding-top:12px;padding-bottom:max(18px,env(safe-area-inset-bottom,0px))}
.choice{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:16px;text-align:left;display:grid;gap:6px}
.choice b{font-size:17px;color:var(--hi);display:flex;align-items:center;gap:10px}
.choice span{font-size:14px;color:var(--text);line-height:1.5}
.choice small{font-family:var(--f-mono);font-size:11.5px;color:var(--soft)}
.choice.red{border-color:rgba(204,69,39,.6);background:linear-gradient(160deg,#3a2826,var(--panel))}
.choice .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--line);flex:none}
.choice .ic svg{width:16px;height:16px}
.choice[disabled]{opacity:.45}

/* ---------- hub ---------- */
.hub-top{position:relative;flex:none;padding-top:max(12px,env(safe-area-inset-top,0px));overflow:hidden}
.hub-top .bg{background-position:center 38%;filter:saturate(.75) brightness(.8)}
.hub-top::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(29,35,44,.35),rgba(29,35,44,.82) 60%,var(--bg))}
.jp .hub-top .bg{background-position:center 22%;filter:none}
.jp .hub-top::after{background:linear-gradient(180deg,rgba(242,233,217,.15),rgba(242,233,217,.72) 55%,var(--bg))}
.hub-in{position:relative;z-index:1;display:grid;gap:12px;padding-bottom:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who svg{width:44px;height:44px;flex:none}
.who div{min-width:0;display:grid}
.who b{font-size:16px;color:var(--hi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{font-size:12px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jp .who span{color:var(--ink-soft)}
.miles{display:inline-flex;align-items:center;gap:7px;background:rgba(16,19,24,.55);border:1px solid rgba(211,162,60,.4);padding:6px 12px 6px 8px;border-radius:999px;font-variant-numeric:tabular-nums}
.jp .miles{background:rgba(255,250,241,.88)}
.miles svg{width:20px;height:20px}
.miles b{color:var(--goldtxt);font-size:15px}
.miles span{font-size:11px;color:var(--soft);font-family:var(--f-mono)}
.buff{font-size:11.5px;font-family:var(--f-mono);color:var(--torii);margin-left:2px}
.day{font-family:var(--f-mono);font-size:12px;color:var(--text);letter-spacing:.04em;text-align:right}
.day small{display:block;color:var(--soft)}
.prog{display:grid;gap:6px}
.prog-bar{height:8px;border-radius:99px;background:var(--chip);overflow:hidden;display:flex}
.jp .prog-bar{background:rgba(42,39,48,.1)}
.prog-bar i{display:block;height:100%}
.prog-bar .m{background:linear-gradient(90deg,var(--torii),var(--momiji))}
.prog-bar .l{background:rgba(229,134,58,.32)}
.prog-txt{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--soft);font-variant-numeric:tabular-nums}
.prog-txt b{color:var(--text);font-weight:500}

.tab-body{padding-top:6px;padding-bottom:20px;display:grid;gap:12px;align-content:start;grid-auto-rows:max-content}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:8px 0 0}
.sec-h h3{margin:0;font-size:13px;font-family:var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--soft);font-weight:500}
.sec-h span{font-size:12px;color:var(--soft)}

.banner{border-radius:var(--r);padding:14px;display:grid;gap:10px;background:#3b2a24;border:1px solid rgba(204,69,39,.55)}
.banner p{margin:0;font-size:14px;line-height:1.5;color:var(--paper)}
.banner p b{color:#fff}
.banner.calm{background:var(--panel);border-color:var(--line)}
.banner.calm p{color:var(--text)} .banner.calm p b{color:var(--hi)}
.banner.gold{background:#33301f;border-color:rgba(211,162,60,.5)}
.jp .banner{background:#fbe9e1;border-color:rgba(204,69,39,.45)}
.jp .banner p{color:var(--ink)} .jp .banner p b{color:var(--torii)}
.jp .banner.gold{background:#fbf1d8;border-color:rgba(211,162,60,.6)}
.jp .banner.calm{background:var(--panel);border-color:var(--line)}

.mail{position:relative;display:grid;grid-template-columns:34px 1fr;align-items:center;gap:12px;padding:10px 12px 10px 16px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);text-align:left;width:100%}
.mail.unread::before{content:"";position:absolute;left:6px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--momiji)}
.mail .ini{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--paper)}
.mail-m{min-width:0;display:grid;gap:3px}
.mail-top{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.mail-top b{color:var(--hi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mail-top time{font-family:var(--f-mono);font-size:11.5px;color:var(--soft);flex:none}
.mail-s{font-size:14.5px;font-weight:700;color:var(--hi);line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mail-sub{font-size:12.5px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kn{font-family:var(--f-kana);font-size:14px;letter-spacing:.06em}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{font-size:11.5px;font-family:var(--f-mono);padding:3px 8px;border-radius:7px;background:var(--chip);color:var(--soft)}
.chip.k{font-family:var(--f-kana);font-size:14px;color:var(--hi);background:rgba(229,134,58,.16);padding:2px 8px}
.mail.locked{opacity:.45;pointer-events:none}
.mail.queued{opacity:.55}
.mail.done{opacity:.6}
.mail.done::before{display:none}
.mail .num{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:17px;background:var(--chip);color:var(--hi)}
.mail.done .num{background:var(--moss);color:#fff}
.mail.unread .num{background:var(--torii);color:#fff}

.chapter{display:grid;gap:8px}
.ch-h{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:8px}
.ch-h div{display:grid;gap:1px}
.ch-h b{font-family:var(--f-display);font-size:22px;font-weight:800;color:var(--hi);line-height:1.1}
.ch-h small{font-size:12.5px;color:var(--soft)}
.ch-h .st{font-family:var(--f-mono);font-size:11.5px;color:var(--soft);flex:none}
.ch-lock{border:1.5px dashed var(--line);border-radius:var(--r);padding:14px;display:grid;gap:8px;color:var(--soft);font-size:13.5px;line-height:1.5}
.ch-lock b{color:var(--hi)}

.event{display:grid;grid-template-columns:62px 1fr;gap:12px;padding:14px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);align-items:start}
.event time{font-family:var(--f-mono);font-size:13px;color:var(--text);padding-top:2px}
.event b{display:block;color:var(--hi);font-size:15px}
.event p{margin:4px 0 10px;font-size:13.5px;color:var(--soft);line-height:1.5}
.event .done{font-size:12.5px;color:#7fb886;font-family:var(--f-mono);margin-top:6px;display:inline-block}
.jp .event .done{color:var(--moss)}
.event .muted{font-size:12.5px;color:var(--soft);font-family:var(--f-mono)}
.event.hot{border-color:rgba(204,69,39,.55)}

.empty{padding:28px 12px;text-align:center;color:var(--soft);font-size:14.5px;line-height:1.6}
.empty b{display:block;color:var(--text);font-family:var(--f-display);font-size:20px;margin-bottom:4px}

.tabs{flex:none;display:grid;grid-template-columns:repeat(4,1fr);background:var(--tabbg);border-top:1px solid var(--tabline);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs button{border:0;background:none;display:grid;justify-items:center;gap:3px;padding:10px 0 9px;font-size:11px;color:var(--soft);position:relative}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-selected="true"]{color:var(--hi)}
.tabs button[aria-selected="true"] svg{color:var(--torii)}
.badge{position:absolute;top:6px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:99px;background:var(--torii);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums}

/* shop */
.item{display:grid;grid-template-columns:52px 1fr;gap:12px;padding:14px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line)}
.item .ico{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-family:var(--f-kana);font-weight:600;font-size:15px;background:var(--paper-2);color:var(--ink);text-align:center;line-height:1.1;padding:4px}
.item .ico svg{width:28px;height:28px;color:var(--torii)}
.item b{color:var(--hi);font-size:15.5px;display:block}
.item .jpn{font-family:var(--f-kana);font-size:13px;color:var(--soft)}
.item p{margin:4px 0 10px;font-size:13.5px;color:var(--soft);line-height:1.5}
.item .owned{font-family:var(--f-mono);font-size:12px;color:var(--moss)}
.price{display:inline-flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums}
.price svg{width:16px;height:16px}
.listing{border-radius:16px;overflow:hidden;background:var(--panel);border:1px solid var(--line)}
.listing .ph{height:96px;background-size:cover;position:relative}
.listing .ph span{position:absolute;left:12px;bottom:10px;background:var(--torii);color:var(--paper);font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;padding:3px 8px;border-radius:6px}
.listing .bd{padding:14px;display:grid;gap:6px}
.listing .bd b{font-size:16px;color:var(--hi)}
.listing .bd .jt{font-family:var(--f-kana);font-size:16px;line-height:1.6;color:var(--hi)}
.listing .bd .en{font-size:13px;color:var(--soft);line-height:1.5}
.listing .bd small{font-family:var(--f-mono);font-size:11.5px;color:var(--soft)}

/* boarding pass */
.pass{background:var(--paper);color:var(--ink);border-radius:16px;overflow:hidden}
.pass-h{background:var(--torii);color:var(--paper);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.14em}
.pass-b{padding:16px;display:grid;gap:14px}
.route{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.route div{display:grid}
.route div:last-child{text-align:right}
.route b{font-family:var(--f-display);font-size:34px;line-height:1;font-weight:800}
.route span{font-size:11.5px;color:var(--ink-soft)}
.route svg{width:36px;height:36px;color:var(--torii)}
.pass-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1.5px dashed #c9bba3;padding-top:12px}
.pass-meta div{display:grid;gap:2px;min-width:0}
.pass-meta small{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;color:var(--ink-soft)}
.pass-meta b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.req{display:grid;gap:10px}
.req-row{display:grid;gap:5px}
.req-row .t{display:flex;justify-content:space-between;font-size:13px;font-variant-numeric:tabular-nums}
.req-row .t span:last-child{font-family:var(--f-mono);font-size:12px;color:var(--ink-soft)}
.req-bar{height:7px;border-radius:99px;background:var(--paper-2);overflow:hidden}

.board{display:grid;gap:14px}

.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:5px}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:5px}
.kc{aspect-ratio:1;max-width:100%;border:0;border-radius:9px;font-family:var(--f-kana);font-size:17px;display:grid;place-items:center;background:var(--chip);color:var(--soft);padding:0;opacity:.75}
.wgrid .kc{aspect-ratio:auto;min-height:38px;font-size:14px;padding:4px 6px}
.kc.l{background:rgba(229,134,58,.18);color:var(--hi);opacity:1}
.kc.m{background:var(--mbg);color:var(--mfg);opacity:1}
.kc.e{box-shadow:inset 0 0 0 1.5px var(--torii)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--soft)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.gram-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.gram-row b{font-family:var(--f-kana);font-size:15px;color:var(--hi);font-weight:600}
.gram-row span{font-family:var(--f-mono);font-size:11px;color:var(--soft);flex:none}
.gram-row span.ok{color:var(--moss)}

/* ---------- quiz ---------- */
.q-top{flex:none;padding-top:max(12px,env(safe-area-inset-top,0px));display:grid;gap:10px;padding-bottom:6px}
.q-kicker{font-family:var(--f-mono);font-size:11.5px;color:var(--soft);letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q-title{font-size:15px;color:var(--hi);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q-bar{height:6px;border-radius:99px;background:var(--chip);overflow:hidden}
.q-bar i{display:block;height:100%;background:var(--momiji);transition:width .3s}
.q-main{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px;padding-top:6px;padding-bottom:max(16px,env(safe-area-inset-bottom,0px));overflow-y:auto}
.card{position:relative;background:var(--card);color:var(--ink);border-radius:20px;padding:44px 18px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:200px;flex:1;max-height:340px;box-shadow:0 10px 30px rgba(0,0,0,.18);text-align:center}
.jp .card{border:1px solid var(--line);box-shadow:0 10px 26px rgba(90,60,30,.1)}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(120% 80% at 20% 0%,rgba(229,134,58,.08),transparent 60%),radial-gradient(90% 70% at 100% 100%,rgba(90,111,166,.08),transparent 60%)}
.card .ask{font-size:12px;color:var(--ink-soft);font-family:var(--f-mono);letter-spacing:.05em;position:absolute;top:15px;left:16px;right:56px;text-align:left}
.card .glyph{font-family:var(--f-kana);font-weight:600;font-size:clamp(92px,30vw,128px);line-height:1}
.card .glyph.long{font-size:clamp(78px,24vw,104px)}
.card .roma{font-family:var(--f-display);font-weight:800;font-size:clamp(56px,18vw,76px);line-height:1;letter-spacing:.02em}
.card .word{font-family:var(--f-kana);font-weight:600;line-height:1.15;word-break:keep-all;overflow-wrap:anywhere}
.card .kanji{font-family:var(--f-display);font-size:20px;color:var(--ink-soft);font-weight:500}
.card .eng{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,8.5vw,36px);line-height:1.2;text-wrap:balance}
.card .sent{font-family:var(--f-kana);font-weight:600;font-size:clamp(21px,6.4vw,26px);line-height:1.6;text-wrap:balance}
.card .sent .blank{display:inline-block;min-width:2.4em;border-bottom:3px solid var(--torii);margin:0 2px;color:var(--torii)}
.card .gloss{font-size:14px;color:var(--ink-soft);line-height:1.5}
.card .speak{position:absolute;top:10px;right:10px;background:rgba(42,39,48,.07);color:var(--ink)}
.card .note{font-size:14px;color:var(--ink-soft);line-height:1.55;max-width:34ch;text-wrap:pretty}
.card .twin{font-family:var(--f-kana);font-size:13px;color:var(--ink-soft)}
.card .twin b{font-size:22px;color:var(--torii);font-weight:600;vertical-align:-3px;margin-left:4px}
.card .rom-sm{font-family:var(--f-display);font-size:30px;font-weight:700;color:var(--torii)}
.card .en-sm{font-family:var(--f-display);font-size:24px;font-weight:700;color:var(--torii);line-height:1.25}
.card .pattern{font-family:var(--f-kana);font-weight:600;font-size:clamp(24px,7.4vw,32px);color:var(--torii);line-height:1.3}
.card .exs{display:grid;gap:8px;width:100%;text-align:left;margin-top:4px}
.card .exs div{background:rgba(42,39,48,.05);border-radius:10px;padding:8px 12px;display:grid;gap:2px}
.card .exs b{font-family:var(--f-kana);font-size:17px;font-weight:600}
.card .exs span{font-size:13px;color:var(--ink-soft)}
.card .exs button{all:unset;cursor:pointer;display:grid;gap:2px}
.card.tall{max-height:none}
.card.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:none}
.o{min-height:64px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel);color:var(--hi);font-size:21px;font-weight:700;display:grid;place-items:center;position:relative;padding:8px 10px;line-height:1.25;transition:background .15s,border-color .15s,transform .1s}
.o:active{transform:scale(.98)}
.o.kana{font-family:var(--f-kana);font-size:30px;font-weight:600}
.o.kw{font-family:var(--f-kana);font-size:19px;font-weight:600}
.o.en{font-size:15.5px;font-weight:700}
.o .k{position:absolute;top:6px;left:9px;font-size:10px;color:var(--soft);font-family:var(--f-mono);font-weight:400}
.o.ok{background:var(--moss);border-color:var(--moss);color:#fff}
.o.bad{background:var(--torii);border-color:var(--torii);color:#fff}
.o.ok .k,.o.bad .k{color:rgba(255,255,255,.7)}
.o.dim{opacity:.4}
.o.idk{grid-column:1/-1;min-height:44px;font-size:14px;font-weight:500;color:var(--soft);background:transparent}
.fb{flex:none;min-height:52px;display:flex;align-items:center;gap:12px}
.fb .msg{flex:1;min-width:0;font-size:14px;line-height:1.45;color:var(--text)}
.fb .msg b{font-family:var(--f-kana);font-size:19px;color:var(--hi)}
.float{position:absolute;right:58px;top:14px;font-weight:700;color:var(--goldtxt);font-size:15px;animation:floatUp .9s ease forwards;pointer-events:none;font-variant-numeric:tabular-nums}
.jp .float{color:#9a6f12}
@keyframes floatUp{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-26px)}}

/* email / brief */
.email-head{background:var(--card);color:var(--ink);border-radius:18px;padding:16px;display:grid;gap:10px}
.jp .email-head{border:1px solid var(--line)}
.email-head .meta{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-family:var(--f-mono);font-size:11.5px;color:var(--ink-soft)}
.email-head .meta b{color:var(--ink);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.email-head h2{margin:0;font-size:18px;line-height:1.35;font-weight:700}
.email-head .big{font-family:var(--f-display);font-size:26px;font-weight:800;line-height:1.15}
.email-head p{margin:0;font-size:14.5px;line-height:1.6;color:#3d3840;white-space:pre-line}
.email-head .att{display:flex;gap:8px;flex-wrap:wrap}
.email-head .att span{font-family:var(--f-kana);font-size:22px;font-weight:600;background:var(--paper-2);border-radius:10px;min-width:46px;height:46px;padding:0 10px;display:grid;place-items:center}
.email-head .att.words span{font-size:16px}
.email-head .gp{font-family:var(--f-kana);font-weight:600;color:var(--torii);font-size:17px}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--momiji)}

/* results */
.res{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:18px;padding-top:max(20px,env(safe-area-inset-top,0px));padding-bottom:max(20px,env(safe-area-inset-bottom,0px));overflow-y:auto}
.res h2{font-family:var(--f-display);font-size:32px;line-height:1.1;margin:0;color:var(--hi);text-wrap:balance}
.res .sub{margin:0;color:var(--text);font-size:15px;line-height:1.6}
.res .score{display:flex;gap:10px}
.res .score div{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:2px}
.res .score small{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;color:var(--soft);text-transform:uppercase}
.res .score b{font-size:24px;color:var(--hi);font-variant-numeric:tabular-nums}
.res .score b.gold{color:var(--goldtxt)}
.stamp{align-self:flex-start;font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:.14em;padding:8px 16px;border:4px solid currentColor;border-radius:8px;transform:rotate(-7deg);animation:stamp .45s cubic-bezier(.2,1.6,.4,1) both}
.stamp.red{color:var(--torii)}
.stamp.green{color:#7fb886}
.jp .stamp.green{color:var(--moss)}
@keyframes stamp{from{opacity:0;transform:rotate(-7deg) scale(2.2)}to{opacity:1;transform:rotate(-7deg) scale(1)}}

/* day transition + ending */
.day-in{position:relative;margin-top:auto;padding-bottom:max(24px,env(safe-area-inset-bottom,0px));display:grid;gap:12px}
.day-in .big{font-family:var(--f-display);font-size:44px;font-weight:800;color:#fff;line-height:1}
.day-in .wd{font-family:var(--f-mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--mist-soft)}
.day-in p{margin:0;color:var(--mist);font-size:16px;line-height:1.6}
.day-in .meta{font-family:var(--f-mono);font-size:12.5px;color:var(--mist-soft);letter-spacing:.06em}
.end .bg.bloom{filter:grayscale(1) brightness(.7);animation:bloom 3.2s ease .3s forwards}
@keyframes bloom{to{filter:none}}
.end-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(245,237,224,0) 35%,rgba(28,22,20,.75) 70%,rgba(28,22,20,.94))}
.end-in{position:relative;margin-top:auto;padding-bottom:max(24px,env(safe-area-inset-bottom,0px));display:grid;gap:12px;color:var(--paper)}
.end-in .jpk{font-family:var(--f-kana);font-size:15px;letter-spacing:.2em;color:var(--momiji)}
.end-in h2{font-family:var(--f-display);font-size:34px;line-height:1.08;margin:0;color:#fff}
.end-in p{margin:0;font-size:15px;line-height:1.6;color:rgba(245,237,224,.88)}

/* in-screen sheet (food order) */
.sheet-wrap{position:absolute;inset:0;background:rgba(20,16,14,.45);display:flex;align-items:flex-end;z-index:20;animation:fadeIn .2s ease both}
.sheet{width:100%;background:var(--bg);border-radius:22px 22px 0 0;padding-top:18px;padding-bottom:max(18px,env(safe-area-inset-bottom,0px));display:grid;gap:12px;animation:up .28s ease both}
@keyframes up{from{transform:translateY(40px)}to{transform:none}}
.sheet .say{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:4px;color:var(--ink)}
.sheet .say b{font-family:var(--f-kana);font-size:22px;font-weight:600}
.sheet .say span{font-size:13px;color:var(--ink-soft)}
.sheet h3{margin:0;font-size:17px;color:var(--hi)}
.sheet .opts .o{min-height:56px;font-size:15.5px}

.toast{position:absolute;left:50%;bottom:86px;transform:translateX(-50%) translateY(20px);background:var(--paper);color:var(--ink);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:50;max-width:calc(100% - 40px);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast b{font-family:var(--f-kana);font-size:18px}
.danger-link{background:none;border:0;color:var(--soft);font-size:13px;text-decoration:underline;padding:6px 0;justify-self:start}
.av{width:44px;height:44px;border-radius:50%;object-fit:cover;object-position:center 25%;background:var(--paper-2);flex:none;display:block;box-shadow:0 0 0 2px rgba(245,237,224,.5)}
.chars{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.ch{border:0;padding:0;background:var(--paper-2);border-radius:50%;aspect-ratio:1;max-width:100%;overflow:hidden;box-shadow:0 0 0 2px var(--line);transition:box-shadow .2s,transform .15s,opacity .2s}
.ch img{width:100%;height:100%;object-fit:cover;object-position:center 25%;display:block}
.ch[aria-pressed="true"]{box-shadow:0 0 0 3px var(--momiji);transform:scale(1.06)}
.chars.has .ch:not([aria-pressed="true"]){opacity:.55}
.opt .job .tag{margin-top:0}
.place{position:relative;margin-top:auto;padding-bottom:max(24px,env(safe-area-inset-bottom,0px));display:grid;gap:10px}
.place h2{margin:0;font-family:var(--f-display);font-size:32px;color:#fff;line-height:1.1}
.place>p{margin:0 0 6px;color:var(--mist);font-size:15px}
.place .choice{background:rgba(29,35,44,.86);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:14px 16px}
.place .choice.red{background:rgba(70,36,30,.9)}
.clock-btn{animation:rise .4s ease both}
.att-list{display:grid;gap:10px}
.kcard{display:grid;grid-template-columns:92px minmax(0,1fr);align-items:center;gap:12px;background:var(--card);color:var(--ink);border-radius:18px;padding:12px 14px;border:0;text-align:left;width:100%;box-shadow:0 6px 18px rgba(0,0,0,.14);transition:transform .1s,box-shadow .2s}
.kcard:active{transform:scale(.985)}
.kcard.on{box-shadow:0 0 0 2.5px var(--momiji)}
.kcard .gl{font-family:var(--f-kana);font-weight:600;font-size:62px;line-height:1.05;text-align:center}
.kcard .gl.long{font-size:42px}
.kcard>span:last-child{display:grid;gap:3px}
.kcard .rm{font-family:var(--f-display);font-weight:800;font-size:26px;color:var(--torii);line-height:1.1}
.kcard .nt{font-size:13px;color:var(--ink-soft);line-height:1.45}
.kcard.w{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
.kcard.w .gl{font-size:26px;text-align:left;line-height:1.25}
.kcard.w .rm{font-size:17px}
.jp .kcard{border:1px solid var(--line);box-shadow:0 4px 12px rgba(90,60,30,.08)}
.email-head.mini{padding:14px 16px;gap:6px}
.email-head.mini h2{font-size:17px}
.scene{margin:0;font-size:15px;line-height:1.55;color:var(--text)}
.gcard{background:var(--card);color:var(--ink);border-radius:18px;padding:16px;display:grid;gap:8px;border:1px solid var(--line)}
.gcard .pattern{font-family:var(--f-kana);font-weight:600;font-size:24px;color:var(--torii);line-height:1.3}
.gcard p{margin:0;font-size:14px;color:var(--ink-soft);line-height:1.55}
.gcard .ex{all:unset;cursor:pointer;display:grid;gap:2px;background:rgba(42,39,48,.05);border-radius:10px;padding:8px 12px}
.gcard .ex b{font-family:var(--f-kana);font-size:17px;font-weight:600}
.gcard .ex span{font-size:13px;color:var(--ink-soft)}
.q-main>.label{margin:4px 0 -4px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}}
</style>

const CHAPTERS = [
 {id:"c1", jp:"関西空港", kana:"かんさいくうこう", name:"Kansai Airport", blurb:"Your first hour in Japan. Greetings, introductions, money.", gate:null, missions:[

function noteFor(it){
  const kata = it.script === "kata";
  if (it.kind === "base") return kata ? "Hiragana: " + it.hira : (MNEM[it.g] || "");
  if (it.kind === "daku") {
    const code = it.hira.charCodeAt(0), p = it.r[0] === "p";
    const baseH = String.fromCharCode(code - (p ? 2 : 1)), base = kata ? toKata(baseH) : baseH;

/* ================= FALLING LEAVES ================= */
function leaves(canvas, count = 16){
  const ctx = canvas.getContext("2d"), reduce = matchMedia("(prefers-reduced-motion: reduce)").matches, cols = ["#cc4527","#e5863a","#d9612f","#e9a23f","#b8381f"];
  let W = 0, H = 0; const dpr = Math.min(2, window.devicePixelRatio || 1);
  const size = () => { const r = canvas.getBoundingClientRect(); W = r.width; H = r.height; canvas.width = W * dpr; canvas.height = H * dpr; ctx.setTransform(dpr,0,0,dpr,0,0); };
  size();
  const L = Array.from({length:count}, () => ({x:Math.random()*W, y:Math.random()*H, s:6+Math.random()*9, vy:.35+Math.random()*.7, vx:-.2+Math.random()*.4, r:Math.random()*6.28, vr:-.02+Math.random()*.04, ph:Math.random()*6.28, c:pick(cols)}));
  function leaf(l){
    ctx.save(); ctx.translate(l.x, l.y); ctx.rotate(l.r); ctx.fillStyle = l.c; ctx.globalAlpha = .85; ctx.beginPath();
    for (let i = 0; i < 14; i++) { const a = -Math.PI/2 + (i / 14) * Math.PI * 2, odd = i % 2, lobe = i % 4 === 0 ? 1 : .78; const rr = odd ? l.s * .42 : l.s * lobe; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
    ctx.closePath(); ctx.fill(); ctx.strokeStyle = l.c; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0, l.s * 1.1); ctx.stroke(); ctx.restore();
  }
  function frame(){
    if (!canvas.isConnected) return; ctx.clearRect(0,0,W,H);
    L.forEach(l => { l.ph += .02; l.y += l.vy; l.x += l.vx + Math.sin(l.ph) * .5; l.r += l.vr; if (l.y > H + 20) { l.y = -20; l.x = Math.random() * W; } leaf(l); });
    if (!reduce) requestAnimationFrame(frame);
  }
  frame();
  window.addEventListener("resize", size);
}

/* ================= QUESTION BUILDERS ================= */
function kanaOptions(item){
  const used = new Set([item.r]), usedG = new Set([item.g]), picks = [];
  const add = c => { if (picks.length < 3 && c && !used.has(c.r) && !usedG.has(c.g)) { picks.push(c); used.add(c.r); usedG.add(c.g); } };
  shuffle((CONF[item.g]||[]).map(g => ITEMS[g])).forEach(add);
  shuffle(GROUPS.find(g => g.id === item.group).items).forEach(add);
  shuffle(ALL.filter(it => it.script === item.script && it.kind === item.kind)).forEach(add);
  shuffle(ALL.filter(it => it.script === item.script)).forEach(add);
  return shuffle([item, ...picks]);
}
function vocabOptions(item, key){
  const used = new Set([item[key]]), picks = [];
  const add = c => { if (picks.length < 3 && !used.has(c[key])) { picks.push(c); used.add(c[key]); } };
  shuffle(item.m.vocab).forEach(add); shuffle(VOCAB.filter(v => v.ch === item.ch)).forEach(add); shuffle(VOCAB).forEach(add);
  return shuffle([item, ...picks]);
}
const DIRS = {kana:["g2r","r2g"], vocab:["j2e","e2j"], gram:["fill"]};
const Q = (id, dir) => ({id, dir: dir || pick(DIRS[REG[id].type])});
function buildQ(q){
  const it = REG[q.id];
  if (it.type === "kana") {
    const g2r = q.dir === "g2r", o = kanaOptions(it);
    return {...q, it, ask: g2r ? "WHICH SOUND IS THIS?" : "WHICH KANA MAKES THIS SOUND?", say: it.g,
      prompt: g2r ? `<div class="glyph ${it.g.length > 1 ? "long" : ""}">${it.g}</div>` : `<div class="roma">${it.r}</div><div class="twin">${it.script === "hira" ? "hiragana" : "katakana"}</div>`,
      speakBtn: g2r, opts: o.map(x => ({html: g2r ? x.r : x.g, cls: g2r ? "" : "kana", ok: x === it})), reveal:`<b>${it.g}</b> = ${it.r}`};
  }
  if (it.type === "vocab") {
    const j2e = q.dir === "j2e", o = vocabOptions(it, j2e ? "en" : "kana"), long = it.kana.length;
    const size = long <= 3 ? 64 : long <= 5 ? 48 : long <= 7 ? 38 : 30;
    return {...q, it, ask: j2e ? "WHAT DOES THIS MEAN?" : "HOW DO YOU SAY THIS?", say: it.kana,
      prompt: j2e ? `<div class="word" style="font-size:${size}px">${it.kana}</div>${it.kanji ? `<div class="kanji">${it.kanji}</div>` : ""}` : `<div class="eng">${esc(it.en)}</div>`,
      speakBtn: j2e, opts: o.map(x => ({html: j2e ? esc(x.en) : x.kana, cls: j2e ? "en" : "kw", ok: x === it})), reveal:`<b>${it.kana}</b>${it.kanji ? " (" + it.kanji + ")" : ""} = ${esc(it.en)}`};
  }
  const o = shuffle(it.opts.map((x, i) => ({html: x, cls:"kw", ok: i === 0})));
  return {...q, it, ask:"FILL THE BLANK", say: fill(it.s, it.opts[0]),
    prompt:`<div class="sent">${esc(it.s).replace("＿＿", '<span class="blank">　</span>')}</div><div class="gloss">${esc(it.en)}</div>`,
    speakBtn:false, opts:o, reveal:`<b>${esc(fill(it.s, it.opts[0]))}</b><br>${esc(it.en)}`};
}

/* ================= QUIZ ENGINE ================= */
function runQuiz(cfg){
  const queue = cfg.questions.map(buildQ);
  const requeues = new Map(), firstSeen = new Set();
  const stats = {correct:0, wrong:0, total:queue.length, miles:0, missed:new Set(), right:new Set(), mastered:[]};
  let done = 0, locked = false, keyHandler = null;
  const el = screen(`
    <div class="q-top pad">
      <div class="row"><div style="min-width:0"><div class="q-kicker">${esc(cfg.kicker)}</div><div class="q-title">${esc(cfg.title)}</div></div>
        <button class="icon-btn" id="qx" aria-label="Leave">${I.close}</button></div>
      <div class="q-bar"><i id="qbar"></i></div>
    </div>
    <div class="q-main pad" id="qm"></div>`, isJP() ? "jp" : "");
  const leave = $("#qx", el);
  hold(leave, I.close, () => { document.removeEventListener("keydown", keyHandler); cfg.onExit ? cfg.onExit() : home(); });
  leave.addEventListener("click", () => { if (!leave.dataset.tip) { leave.dataset.tip = 1; toast("Tap × again to leave. Progress in this session is lost.", 2200); } });
  const qm = $("#qm", el), bar = $("#qbar", el);
  function render(){
    if (!queue.length) { document.removeEventListener("keydown", keyHandler); cfg.onDone(stats); return; }
    bar.style.width = (done / (done + queue.length) * 100) + "%";
    const q = queue[0];
    qm.innerHTML = `
      <div class="card" id="card"><span class="ask">${q.ask}</span>
        ${q.prompt}</div>
      <div class="opts">${q.opts.map((o, i) => `<button class="o ${o.cls}" data-i="${i}"><span class="k">${i+1}</span>${o.html}</button>`).join("")}
        ${cfg.idk ? `<button class="o idk" data-i="idk">I don't know this one</button>` : ""}</div>
      <div class="fb" id="fb"></div>`;
    const t0 = performance.now(); locked = false;
    $$(".o", qm).forEach(b => b.addEventListener("click", () => choose(b, q, t0)));
  }
  function choose(b, q, t0){
    if (locked) return; locked = true;
    const ms = performance.now() - t0, idx = b.dataset.i, chosen = idx === "idk" ? null : q.opts[+idx], ok = !!(chosen && chosen.ok);
    const first = !firstSeen.has(q.id); firstSeen.add(q.id);
    const card = $("#card", qm), fb = $("#fb", qm);
    speak(q.say);
    $$(".o", qm).forEach(x => { const o = q.opts[+x.dataset.i]; if (o && o.ok) x.classList.add("ok"); else if (x !== b) x.classList.add("dim"); });
    if (ok) {

      const res = (cfg.onAnswer && cfg.onAnswer(q, true, first && !q.retry, ms)) || {};
      let gain = res.miles || 0;
      if (gain && cfg.buff) gain = Math.round(gain * buffMult());

      if (res.mastered) stats.mastered.push(q.id);

      setTimeout(render, q.it.type === "gram" ? 900 : gain ? 650 : 520);
    } else {
      stats.wrong++; stats.missed.add(q.id);
      if (idx !== "idk") b.classList.add("bad");
      card.classList.add("shake"); SFX.play(idx === "idk" ? "tap" : "wrong");
      if (cfg.onAnswer) cfg.onAnswer(q, false, first && !q.retry, ms);
      queue.shift(); done++;

      if (cfg.requeue && n < 2) { requeues.set(q.id, n + 1); const at = Math.min(queue.length, 2 + (Math.random() * 3 | 0)); queue.splice(at, 0, {...buildQ(Q(q.id, q.dir)), retry:true}); }
      fb.innerHTML = `<div class="msg">${q.reveal}${cfg.requeue && n < 2 ? `<br><span style="color:var(--soft);font-size:12.5px">It'll come back in a moment.</span>` : ""}</div><button class="btn btn-paper btn-sm" id="nx">Next</button>`;
      const nx = $("#nx", fb); nx.focus({preventScroll:true}); nx.addEventListener("click", () => { SFX.play("tap"); render(); });
    }
  }
  keyHandler = e => {
    if (!qm.isConnected) { document.removeEventListener("keydown", keyHandler); return; }
    if (/^[1-4]$/.test(e.key) && !locked) { const b = $(`.o[data-i="${+e.key - 1}"]`, qm); if (b) b.click(); }

  };

}

/* ---------- DIAGNOSTIC: every correct answer = mastered + miles ---------- */
const placementAnswer = (q, ok) => { if (!ok) return {}; return {miles:10, mastered: masterNow(q.id)}; };
function startDiagnostic(){
  const known = new Set(), parts = [["hira","base"],["hira","extra"],["kata","base"],["kata","extra"]];
  let p = 0, totalMiles = 0, totalRight = 0, totalAsked = 0; const mastered = [];
  function next(){
    while (p < parts.length) {
      const [sc, kind] = parts[p];
      if (kind === "extra" && GROUPS.filter(g => g.script === sc && g.kind === "base" && known.has(g.id)).length < 7) { p++; continue; }
      break;
    }
    if (p >= parts.length) return finish();
    const [sc, kind] = parts[p], groups = GROUPS.filter(g => g.script === sc && (kind === "base" ? g.kind === "base" : g.kind !== "base"));
    const per = kind === "base" ? 2 : 1, tally = {};
    const qs = shuffle(groups.flatMap(g => shuffle(g.items).slice(0, per).map(it => Q(it.g, "g2r"))));
    runQuiz({kicker:`ONBOARDING ASSESSMENT · PART ${p+1}`, title:`${sc === "hira" ? "Hiragana" : "Katakana"} · ${kind === "base" ? "basic characters" : "dakuten & combos"}`, questions:qs, requeue:false, idk:true,
      onExit:() => { save(); placementScreen(); },
      onAnswer:(q, ok) => { const t = (tally[REG[q.id].group] ||= {ok:0, n:0}); t.n++; if (ok) t.ok++; return placementAnswer(q, ok); },
      onDone:stats => { totalMiles += stats.miles; totalRight += stats.correct; totalAsked += stats.correct + stats.wrong; mastered.push(...stats.mastered);
        groups.forEach(g => { const t = tally[g.id]; if (t && t.ok === t.n) known.add(g.id); }); p++; next(); }});
  }
  function finish(){
    let inferred = 0;
    GROUPS.forEach(g => { if (known.has(g.id)) { S.done[g.id] = true; g.items.forEach(it => { if (!isMastered(it.g)) { const s = st(it.g); s.box = Math.max(s.box, 2); s.due = S.day + 1; s.lb = S.day; inferred++; } }); } });
    S.placed = true; save();
    const m = masteredCount();
    results({stamp:"PLACED", title: m ? `${m} kana mastered on day one.` : "Fresh start it is.",
      sub: m ? `Correct answers count as mastered. ${known.size} tasks archived.` : "Your first task is waiting.",
      score:`${totalRight}/${totalAsked}`, miles:totalMiles, mastered: mastered.slice(0, 40), btn:"Go to my desk", next:() => hub("inbox")});
  }
  next();
}

  html += `<div class="event"><time>any</time><div><b>Fix mistakes</b>${slips.length ? `<p>${slips.length} to fix.</p><div class="chips" style="margin-bottom:10px">${slips.slice(0, 12).map(id => `<span class="chip k">${esc(labelOf(id))}</span>`).join("")}</div><button class="btn btn-paper btn-sm" data-act="slip">Practise mistakes</button>` : `<p>None right now.</p>`}</div></div>`;
  html += `<div class="event"><time>any</time><div><b>JLPT N5 mock exam</b><p>24/30 to pass. Unlocks akiya buying, +1,500 miles.</p>
    ${S.cert ? '<span class="done">CERTIFIED ✓</span>' : S.examDay === S.day ? '<span class="muted">Try again tomorrow</span>' : '<button class="btn btn-ghost btn-sm" data-act="exam">Take the exam</button>'}</div></div>`;
  html += `<div class="event"><time>10:30pm</time><div><b>Sleep</b><p>Start the next day.</p><button class="btn btn-ghost btn-sm" data-act="sleep">${I.moon} おやすみなさい</button></div></div>`;
  html += settingsHTML();
  tb.innerHTML = html;
  const on = (a, f) => { const b = $(`[data-act="${a}"]`, tb); if (b) b.addEventListener("click", f); };
  on("rv", startMorning); on("slip", () => startEsc(() => hub2("today"))); on("exam", startExam);
  const sl = $('[data-act="sleep"]', tb);
  if (reviewPending()) hold(sl, "Skip review and sleep?", sleep); else sl.addEventListener("click", sleep);
  wireSettings(tb);
}
function priceTag(p){ return `<span class="price">${I.coin}${fmt(p)}</span>`; }
function renderShop(tb){
  let html = `<div class="sec-h"><h3>Food</h3><span>Miles boost</span></div>`;
  FOODS.forEach(f => {
    html += `<div class="item"><div class="ico">${f.jp}</div><div><b>${f.name}</b><span class="jpn">${f.jp}</span><p>+${Math.round(f.pct * 100)}% miles × ${f.n}</p>
      <button class="btn btn-paper btn-sm" data-food="${f.id}" ${S.miles < f.price ? "disabled" : ""}>Order · ${priceTag(f.price)}</button></div></div>`;
  });
  html += `<div class="sec-h"><h3>Big purchases</h3></div>`;
  Object.entries(SHOP_GATES).forEach(([id, g]) => {
    const owned = S.owned[id], ready = gateReady(id);
    html += `<div class="item"><div class="ico">${GATE_ICON[id]}</div><div><b>${g.name}</b><span class="jpn">${g.jp}</span><p>Unlocks ${g.unlocks}.</p>
      ${owned ? '<span class="owned">OWNED ✓</span>' : ready ? `<button class="btn btn-red btn-sm" data-gate="${id}" ${S.miles < g.price ? "disabled" : ""}>Buy · ${priceTag(g.price)}</button>${S.miles < g.price ? `<p style="margin:6px 0 0">Need ${fmt(g.price - S.miles)} more.</p>` : ""}`
        : `<p style="margin:0">Clear ${g.needs.map(c => chById(c).name).join(" and ")} first.</p>`}</div></div>`;
  });
  html += `<div class="sec-h"><h3>Akiya listings</h3><span>${S.cert ? "N5 certified" : "N5 certificate required"}</span></div>`;
  const show = S.cert || chDone(chById("c6"));
  if (!show && !S.owned.agent) html += `<div class="ch-lock"><span>${I.house.replace("<svg", '<svg width="22" height="22"')}</span><span>Clear <b>Akiya Viewings</b> or pass the <b>N5 exam</b>.</span></div>`;
  else AKIYA.forEach((a, i) => {
    const mine = S.akiya === a.id;
    html += `<div class="listing"><div class="ph" style="background-image:url(japan.jpg);background-position:${["20% 85%","90% 70%","50% 95%"][i]}"><span>${esc(a.place.toUpperCase())}</span></div><div class="bd">
      <b>${esc(a.place)}</b><div class="jt">${a.jp}</div><div class="en">${esc(a.en)}</div><small>${a.rooms}</small>
      ${mine ? '<span class="owned">YOURS ✓</span>' : S.akiya ? "" : !S.cert ? `<p style="margin:4px 0 0;font-size:13px;color:var(--soft)">Needs the N5 certificate.</p>` : `<button class="btn btn-red btn-sm" data-akiya="${a.id}" ${S.miles < a.price ? "disabled" : ""}>Buy this akiya · ${priceTag(a.price)}</button>${S.miles < a.price ? `<p style="margin:4px 0 0;font-size:13px;color:var(--soft)">Need ${fmt(a.price - S.miles)} more.</p>` : ""}`}
    </div></div>`;
  });
  tb.innerHTML = html;
  $$("[data-food]", tb).forEach(b => b.addEventListener("click", () => orderFood(FOODS.find(f => f.id === b.dataset.food))));
  $$("[data-gate]", tb).forEach(b => b.addEventListener("click", () => {
    const id = b.dataset.gate, g = SHOP_GATES[id]; S.miles -= g.price; S.owned[id] = true; save(); SFX.play("buy");
    hub2("missions"); toast(`<b>${g.jp}</b> bought. ${esc(g.unlocks)} unlocked.`, 2800);
  }));
  $$("[data-akiya]", tb).forEach(b => hold(b, "Tap again to sign the contract", () => { const a = AKIYA.find(x => x.id === b.dataset.akiya); S.miles -= a.price; S.akiya = a.id; save(); akiyaEnding(a); }));
}
function orderFood(f){
  const cur = current;
  const opts = shuffle([[`${f.jp}を ください。`, true],[`${f.jp}が ください。`, false],[`${f.jp}に ください。`, false],[`${f.jp}で ください。`, false]]);
  cur.insertAdjacentHTML("beforeend", `<div class="sheet-wrap" id="sw"><div class="sheet pad">
    <div class="say"><span>Shopkeeper</span><b>いらっしゃいませ！</b><span>Welcome! What would you like?</span></div>
    <h3>Order: one ${f.name.toLowerCase()}, please</h3>
    <div class="opts">${opts.map(([t], i) => `<button class="o kw" data-i="${i}">${t}</button>`).join("")}</div>
    <button class="btn btn-ghost btn-sm" id="cx" style="justify-self:center">Never mind</button></div></div>`);
  const sw = $("#sw", cur);
  $("#cx", sw).addEventListener("click", () => sw.remove());
  sw.addEventListener("click", e => { if (e.target === sw) sw.remove(); });
  $$(".o", sw).forEach(b => b.addEventListener("click", () => {
    const ok = opts[+b.dataset.i][1];
    $$(".o", sw).forEach(x => { x.disabled = true; if (opts[+x.dataset.i][1]) x.classList.add("ok"); else if (x !== b) x.classList.add("dim"); });
    if (!ok) b.classList.add("bad");
    S.miles -= f.price; S.buff = {name:f.name, pct:f.pct, left:f.n}; save();
    SFX.play(ok ? "correct" : "wrong"); speak(`${f.jp}を ください`);
    $(".say", sw).innerHTML = ok ? `<span>Shopkeeper</span><b>はい、どうぞ！</b><span>Here you go! (+${Math.round(f.pct*100)}% Zen Miles for ${f.n} sessions)</span>`
      : `<span>Shopkeeper (smiling)</span><b>${f.jp}を ください、ですね。</b><span>She gently corrects you: を marks what you're asking for. Still served.</span>`;
    setTimeout(() => { SFX.play("buy"); hub2("shop"); }, ok ? 1300 : 2600);
  }));
}
function renderProgress(tb){
  let html = `<div class="sec-h"><h3>N5 vocabulary</h3><span>${vocabMastered()}/${VOCAB.length} mastered</span></div>
    <div class="legend"><span><i style="background:var(--mbg)"></i>Mastered</span><span><i style="background:rgba(229,134,58,.4)"></i>Learning</span><span><i style="background:var(--chip)"></i>Not yet</span></div>`;
  CHAPTERS.forEach(ch => {
    html += `<div class="board"><div><h4>${ch.name}</h4><div class="wgrid">${ch.missions.flatMap(m => m.vocab).map(v => { const s = S.items[v.id] || {}; const c = s.box >= MASTER ? "m" : s.box > 0 ? "l" : ""; return `<button class="kc ${c} ${s.esc ? "e" : ""}" data-v="${v.id}">${v.kana}</button>`; }).join("")}</div></div></div>`;
  });
  html += `<div class="sec-h"><h3>Grammar points</h3><span>${gramMastered()}/${MISSIONS.length}</span></div><div class="stack" style="gap:6px">`;
  MISSIONS.forEach(m => { const seen = m.gq.some(q => boxOf(q.id) > 0), done = gramPointDone(m); html += `<div class="gram-row"><b>${esc(m.g.name)}</b><span class="${done ? "ok" : ""}">${done ? "MASTERED" : seen ? "LEARNING" : "NOT YET"}</span></div>`; });
  html += `</div><div class="sec-h"><h3>Kana</h3><span>${masteredCount()}/208</span></div>` + kanaBoard();
  tb.innerHTML = html;
  $$(".kc[data-v]", tb).forEach(b => b.addEventListener("click", () => { const v = REG[b.dataset.v]; speak(v.kana); toast(`<b>${v.kana}</b>${v.kanji ? " " + v.kanji : ""} = ${esc(v.en)}`, 1800); }));
  wireBoard(tb);
}
function sleep(){
  SFX.play("night"); S.day += 1; save();
  const due = dueIds().length;
  const el = screen(`<div class="bg" style="background-image:url(japan.jpg);background-position:center 30%"></div><div class="shade warm"></div>
    <div class="day-in pad">
      <p class="meta">おはようございます · GOOD MORNING</p>
      <div class="wd">Osaka</div><div class="big">Day ${osakaDay()}</div>
      <p>${pick(MORNING)}</p>
      ${due ? `<p style="color:var(--momiji)">${due} items to review.</p>` : ""}
      <button class="btn btn-red" id="in">Head out</button>
    </div>`);
  $("#in", el).addEventListener("click", () => { SFX.play("bell"); hub2(reviewPending() ? "today" : "missions"); });
}

/* ---------- STAGE 2 MISSION ---------- */
function topBar(kicker, title, w){ return `<div class="q-top pad"><div class="row"><div style="min-width:0"><div class="q-kicker">${kicker}</div><div class="q-title">${esc(title)}</div></div><button class="icon-btn" id="qx" aria-label="Back">${I.close}</button></div>${w != null ? `<div class="q-bar"><i style="width:${w}%"></i></div>` : ""}</div>`; }
function missionBrief(m){
  const el = screen(topBar(`MISSION ${m.no} · ${esc(m.ch.name).toUpperCase()}`, m.title) + `
    <div class="q-main pad">
      <p class="scene">${esc(m.scene)}</p>
      <span class="label">New words · tap to hear</span>
      <div class="att-list">${m.vocab.map(v => `<button class="kcard w" data-say="${v.kana}"><span class="gl">${v.kana}</span><span><span class="rm">${esc(v.en)}</span>${v.kanji ? `<span class="nt">${v.kanji}</span>` : ""}</span></button>`).join("")}</div>
      <span class="label">Grammar</span>
      <div class="gcard"><div class="pattern">${esc(m.g.name)}</div><p>${esc(m.g.note)}</p>
        ${m.g.ex.map(([j, e]) => `<button class="ex" data-say="${j}"><b>${j}</b><span>${esc(e)}</span></button>`).join("")}</div>
    </div>
    <div class="sticky-foot pad"><button class="btn btn-red" id="go">Start practice</button></div>`, "jp");
  $("#qx", el).addEventListener("click", () => { SFX.play("tap"); hub2("missions"); });
  $$("[data-say]", el).forEach(b => b.addEventListener("click", () => { $$(".kcard", el).forEach(x => x.classList.toggle("on", x === b)); speak(b.dataset.say); }));
  $("#go", el).addEventListener("click", () => { SFX.play("tap"); missionQuiz(m); });
}
function missionQuiz(m){
  const qs = shuffle(m.vocab.map(v => Q(v.id, "j2e"))).concat(shuffle(m.vocab.map(v => Q(v.id, "e2j"))), m.gq.map(q => Q(q.id, "fill")));
  runQuiz({kicker:`MISSION ${m.no} · PRACTICE`, title:m.title, questions:qs, requeue:true, buff:true, onExit:() => hub2("missions"),
    onAnswer:(q, ok) => ok ? {miles:8} : {},
    onDone:stats => {
      const wasDone = S.done2[m.id], chWas = chDone(m.ch);
      S.done2[m.id] = true; [...m.vocab, ...m.gq].forEach(it => seed(it.id));
      stats.miles += addMiles(60 * buffMult()); useBuff();
      const chNow = chDone(m.ch) && !chWas;
      const gateNext = Object.entries(SHOP_GATES).find(([id, g]) => !S.owned[id] && g.needs.includes(m.ch.id) && gateReady(id));
      let sub = wasDone ? "Practice round." : "Review tomorrow morning.";
      if (chNow) sub = gateNext ? `${esc(gateNext[1].name)} is in the Shop.` : m.ch.id === "c6" ? "Akiya listings are in the Shop." : sub;
      results({stamp:"CLEARED", title: chNow ? `${esc(m.ch.name)} cleared.` : "Mission cleared.", sub, score:`${stats.right.size}/${m.vocab.length + m.gq.length}`, miles:stats.miles, missed:[...stats.missed], missedLabel:"Tricky ones",
        next:() => hub2(chNow && gateNext ? "shop" : "missions")});
      if (chNow) setTimeout(() => SFX.play("fanfare"), 300);
    }});
}
function startMorning(){
  SFX.play("bell");
  const due = dueIds().slice(0, 30);
  if (!due.length) { S.reviewDay = S.day; save(); hub2("missions"); return; }
  runQuiz({kicker:`MORNING REVIEW · OSAKA DAY ${osakaDay()}`, title:`${due.length} items due`, questions:shuffle(due.map(id => Q(id))), requeue:true, buff:true,
    onExit:() => hub2("today"), onAnswer:reviewAnswer(),
    onDone:stats => {
      S.reviewDay = S.day; useBuff();
      const missed = [...stats.missed]; if (!missed.length) stats.miles += addMiles(60 * buffMult());
      const more = dueIds().length;
      results({stamp: missed.length ? "OK" : "完璧", stampColor: missed.length ? "red" : "green", title: missed.length ? "Review done." : "Perfect review.",
        sub: (missed.length ? `${missed.length} added to mistakes.` : "+60 bonus.") + (more ? ` ${more} more due.` : " いってらっしゃい!"),
        score:`${due.length - missed.length}/${due.length}`, miles:stats.miles, mastered:stats.mastered, missed, missedLabel:"Mistakes", next:() => hub2("missions")});
    }});
}
function startExam(){
  const qs = shuffle([...shuffle(VOCAB).slice(0, 15).map(v => Q(v.id)), ...shuffle(GRAMQ).slice(0, 15).map(g => Q(g.id, "fill"))]);
  S.examDay = S.day; save();
  runQuiz({kicker:"JLPT N5 MOCK EXAM · 80% TO PASS", title:"30 questions", questions:qs, requeue:false, onExit:() => { save(); hub2("today"); },
    onAnswer:placementAnswer,
    onDone:stats => {
      const pass = stats.correct >= 24;
      if (pass) { S.cert = true; stats.miles += addMiles(1500); }
      SFX.play("stamp");
      results({stamp: pass ? "合格 PASS" : "不合格", stampColor: pass ? "green" : "red", title: pass ? "N5 certified." : "Not this time.",
        sub: pass ? "+1,500 miles. Akiyas unlocked." : "You needed 24. Try again tomorrow.",
        score:`${stats.correct}/30`, miles:stats.miles, mastered:stats.mastered, missed:[...stats.missed], missedLabel:"Missed", next:() => hub2(pass ? "shop" : "today")});
    }});
}
function akiyaEnding(a){
  SFX.play("fanfare");
  const el = screen(`<div class="bg" style="background-image:url(japan.jpg);background-position:20% 85%"></div><div class="end-shade"></div><canvas class="leaf-canvas"></canvas>
    <div class="end-in pad">
      <div class="jpk">空き家 · ${esc(a.place.toUpperCase())}</div>
      <h2>It's yours, ${esc(S.name)}.</h2>
      <p>${a.jp}</p>
      <p>${esc(a.en)}</p>
      <p style="color:var(--momiji)">Stage 3: renovate with N4 Japanese. Coming soon.</p>
      <div class="stack"><button class="btn btn-red" id="e1">Keep learning in Osaka</button><button class="btn btn-ghost" id="e2" style="color:var(--paper);border-color:rgba(245,237,224,.4)">Title screen</button></div>
    </div>`, "end");
  setTimeout(() => { const c = $(".leaf-canvas", el); if (c) leaves(c, 24); }, 300);
  $("#e1", el).addEventListener("click", () => hub2("missions"));
  $("#e2", el).addEventListener("click", titleScreen);
}

try { SFX.on = localStorage.getItem("owtj-sound") !== "0"; } catch(e){}
["japan.jpg","singapore.jpg","office.jpg","char1.webp","char2.webp","char3.webp","char4.webp"].forEach(src => { const i = new Image(); i.src = src; });

window.claude?.hot?.snapshot?.(() => S && S.name ? {S} : {});
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
